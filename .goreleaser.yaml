version: 2

project_name: sslmigrate

before:
  hooks:
    - go mod tidy

builds:
  - id: sslmigrate
    binary: sslmigrate
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: sslmigrate
    name_template: "sslmigrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - AGENTS.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^data:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: chenrui333
    name: homebrew-openssl-4-migration
  draft: false
  name_template: "v{{.Version}}"
