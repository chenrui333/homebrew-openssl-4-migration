site_name: OpenSSL 4 Migration Dashboard
site_url: https://chenrui333.github.io/homebrew-openssl-4-migration/
repo_url: https://github.com/chenrui333/homebrew-openssl-4-migration
repo_name: chenrui333/homebrew-openssl-4-migration

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
  features:
    - content.tooltips
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Summary: index.md
  - Action Queue: queue.md
  - Tracker: tracker.md
  - Upstream: upstream.md

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tracker.js
